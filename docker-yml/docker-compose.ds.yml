# Nintendo DS matchd image. The default compose file stays on host gcc.
#   docker compose -f compose.yaml -f docker-yml/docker-compose.ds.yml up -d --build matchd
services:
  matchd:
    image: re-hydra-matchd-ds
    build:
      context: ./apps/matchd
      dockerfile: Dockerfile.ds
    environment:
      MATCHD_DS_GCC: arm-none-eabi-gcc
      MATCHD_DS_GXX: arm-none-eabi-g++
      MATCHD_DS_NM: arm-none-eabi-nm
      MATCHD_DS_OBJDUMP: arm-none-eabi-objdump
