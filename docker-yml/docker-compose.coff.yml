# Microsoft x64 COFF matchd image. The default compose file stays on host gcc.
#   docker compose -f compose.yaml -f docker-yml/docker-compose.coff.yml up -d --build matchd
services:
  matchd:
    image: re-hydra-matchd-coff
    build:
      context: ./apps/matchd
      dockerfile: Dockerfile.coff
    environment:
      MATCHD_CLANG: coff-clang
      MATCHD_CLANG_BIN: /usr/bin/clang
      MATCHD_LLVM_NM: llvm-nm
      MATCHD_LLVM_OBJDUMP: llvm-objdump
