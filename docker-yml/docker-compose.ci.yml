# CI only (.github/workflows/ci.yml). GitHub's Ubuntu runners need two more
# options than Docker Desktop before matchd's sandbox self-test passes:
#
# - apparmor=unconfined: Docker's docker-default AppArmor profile denies the
#   mounts bwrap makes inside its user namespace ("bwrap: Failed to make /
#   slave: Permission denied").
# - systempaths=unconfined: Docker masks parts of /proc (kcore, keys, ...) by
#   mounting over them, and the kernel then refuses the fresh /proc bwrap
#   mounts for its pid namespace, since it would reveal them ("Can't mount
#   proc on /newroot/proc: Operation not permitted").
#
# The seccomp profile from docker-compose.yml still applies. Only the added
# options are listed: Compose appends this list to that one, and Compose 2.x
# refuses a repeated entry. See docker-yml/matchd-seccomp.md.
#   docker compose -f compose.yaml -f docker-yml/docker-compose.ci.yml up -d matchd
services:
  matchd:
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
