# CI only (.github/workflows/ci.yml). On hosts with AppArmor (Ubuntu, so
# GitHub's runners), Docker confines every container with its docker-default
# profile, which denies the mounts bwrap makes inside its user namespace, so
# matchd's sandbox self-test fails and matchd exits. Docker Desktop has no
# AppArmor, which is why the plain compose file works there. The seccomp
# profile still applies. See docker-yml/matchd-seccomp.md.
#   docker compose -f compose.yaml -f docker-yml/docker-compose.ci.yml up -d matchd
services:
  matchd:
    security_opt:
      - seccomp=docker-yml/matchd-seccomp.json
      - apparmor=unconfined
