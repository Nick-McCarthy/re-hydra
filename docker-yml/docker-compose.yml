services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rehydra
      POSTGRES_PASSWORD: rehydra
      POSTGRES_DB: rehydra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rehydra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehydra -d rehydra"]
      interval: 5s
      timeout: 5s
      retries: 10

  matchd:
    build:
      context: ./apps/matchd
    environment:
      MATCHD_PORT: "3001"
      MATCHD_TOKEN: dev-matchd-token
      MATCHD_GCC: gcc
      MATCHD_GXX: g++
      MATCHD_LD: ld
      MATCHD_NM: nm
      MATCHD_OBJDUMP: objdump
      MATCHD_TIMEOUT_MS: "30000"
    ports:
      - "127.0.0.1:3001:3001"

  blobs:
    image: adobe/s3mock:latest
    mem_limit: 1280m
    ports:
      - "127.0.0.1:9000:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rehydra
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - rehydra_blobs:/s3mockroot

volumes:
  rehydra_pg:
  rehydra_blobs:
