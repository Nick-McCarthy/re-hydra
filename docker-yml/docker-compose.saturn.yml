# Saturn matchd image. The default compose file stays on host gcc.
#   docker compose -f compose.yaml -f docker-yml/docker-compose.saturn.yml up -d --build matchd
services:
  matchd:
    image: re-hydra-matchd-saturn
    build:
      context: ./apps/matchd
      dockerfile: Dockerfile.saturn
    environment:
      MATCHD_SATURN_GCC: saturn-gcc
      MATCHD_SATURN_NM: sh-elf-nm
      MATCHD_SATURN_OBJDUMP: saturn-objdump
